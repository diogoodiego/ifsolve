name: Run Tests

on:
  push:
    branches: 
    - main
    - dev
  pull_request:
    branches: 
    - main 
    - dev

jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with: 
          node-version: '18.x' 
      - name: npm install, build and test
        run: |
          cd ./frontend/
          npm install
          npm run build --if-present
          npm run test
      - name: Check Code Formating
        run: |
            cd ./frontend/
            cd ./src/
            npx prettier . --check
      - name: Detect Duplicate Code
        run: |
            cd ./frontend/
            cd ./src/
            npx jscpd --format "javascript,typescript,jsx" src/

